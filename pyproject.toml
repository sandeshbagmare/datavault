[project]
name = "datavault"
version = "0.1.0"
description = "Privacy-first data agent using LangGraph, DuckDB, and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core Agent Framework
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",

    # MCP Server
    "fastmcp>=2.0.0",

    # Data Engine
    "duckdb>=1.0.0",

    # Visualization & Documents
    "plotly>=6.0.0",
    "markdown-it-py>=3.0.0",
    "jinja2>=3.1.0",

    # Web Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data Handling
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",

    # Utilities
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datavault"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
